# Publishes a container image when a version tag is pushed.
#
# Until now the only way to run ndBrain was to clone the repository onto the
# machine and build it there. That asks every adopter for a toolchain, ten
# minutes and several gigabytes of build cache on a box they may have chosen to
# be small — and on the author's own server it filled a sixteen gigabyte disk
# and took the service down with it. An image turns installing into
# `docker compose up -d`.
#
# **It builds from a commit the tests have passed on.** `needs: verify` is not
# ceremony: an image published out of an unverified commit is worse than no
# image, because somebody else is running it.
#
# Two architectures on two native runners rather than one with emulation. The
# Dockerfile says it carries no native module on purpose, "so this builds on any
# architecture Node supports without a toolchain" — honouring that is cheap here
# and means an arm64 server is not a second-class install.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  # Written out rather than taken from `${{ github.repository }}`, which yields
  # `jubacCH/ndbrain`: a registry name must be lowercase, and GHCR refuses the
  # push rather than folding it. The repository can be renamed; this line then
  # has to follow, which is cheaper than a release that fails at the last step.
  IMAGE: ghcr.io/jubacch/ndbrain

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed by digest and nothing is tagged yet: a tag
      # that pointed at one architecture while the other was still building
      # would be a tag that works on half the machines that pull it.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The file name is the digest without its `sha256:` prefix, which the
      # merge step puts back. Stripped in the shell and not in the expression:
      # `${...#...}` is bash, and a GitHub expression that looks like it simply
      # expands to nothing.
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    # Beyond the workflow's `contents: read`, for the release entry at the end.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `v1.2.3` becomes `1.2.3` and `latest`. No `1` or `1.2`: a floating major
      # tag is a promise that every future release is compatible with what
      # somebody installed, and this project migrates its database on start.
      - name: One tag over both architectures
        working-directory: /tmp/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${version}"

      # Pushing a tag published two images and left the repository's own
      # Releases page empty, so from the outside it looked as though there were
      # none. Both of the first two had to be written by hand afterwards, which
      # is the kind of step that gets skipped once and then always.
      #
      # Last, and only once the manifest exists: the note tells people to pull
      # an image, and a note that says so before the image is there is worse
      # than a late note.
      #
      # The body is the tag's own message, which is where the release notes are
      # written anyway (see "Cutting a release" in CONTRIBUTING.md). Checked out
      # for exactly that reason — `--notes-from-tag` reads the annotation, so it
      # needs the tag object locally and not just the API.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The release entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo '## Installieren'
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${version}"
            echo '```'
            echo
            echo "Für amd64 und arm64. Eine vollständige Installation steht in"
            echo "[docs/install/compose.yaml](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install/compose.yaml)."
            echo
            echo '---'
            echo
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | tail -n +3
          } > /tmp/notes.md
          # Updated if it is already there rather than failing. A tag can be
          # pushed again — one was on 02.10.2026, when the history was rewritten
          # and every tag object changed — and this step runs after the image is
          # published. Failing here would mark a release red that had in fact
          # done everything that matters.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${version}" \
              --notes-file /tmp/notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${version}" \
              --notes-file /tmp/notes.md
          fi
