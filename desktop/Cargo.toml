[workspace]
resolver = "2"
members = ["capture", "client", "app"]

# Three crates rather than one, and the split is about the test loop as much as
# about layering. `capture` holds every decision and depends on nothing, so
# `cargo test -p ndbrain-capture` costs seconds and the red/green loop never
# compiles Tauri. `client` adds the network and can be exercised against a
# loopback socket. `app` is the shell: tray, shortcut, window, Keychain.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A menu-bar utility: smaller matters more than the last percent of speed.
lto = true
opt-level = "s"
strip = true
