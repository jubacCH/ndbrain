<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover plus the safe-area padding in the stylesheet keeps the
         header clear of the notch on an iPhone in standalone mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Two values so the browser chrome matches whichever theme is active. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f7f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050b0e" />

    <!--
      The ground, before the stylesheet arrives.

      A PWA launched from the home screen shows the document the moment it
      exists; until the bundle's CSS has loaded that is the browser default,
      which on a dark phone is a grey-black that is not this app's and on an
      explicit dark choice under a light system is white. Same values as the
      theme colour in `src/prefs.ts`.
    -->
    <style>
      html { background: #f3f7f8; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #050b0e; } }
      html[data-theme='dark'] { background: #050b0e; }
    </style>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <!-- iOS ignores the manifest icons and looks only for this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ndBrain" />

    <title>ndBrain</title>

    <!--
      The theme, applied before the first paint.

      It has to run here rather than in React: by the time the bundle has parsed
      and mounted, the browser has already painted one frame, and on a dark
      choice against a light system that frame is a white flash in a dark room.
      Inline and synchronous is the only placement that beats it.

      Deliberately forgiving — a blocked localStorage or a stray value must leave
      the page on the system default rather than throw before anything renders.
    -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('ndbrain.theme');
          if (choice === 'dark' || choice === 'light') {
            document.documentElement.setAttribute('data-theme', choice);
            // The chrome follows an explicit choice from the first frame too.
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i += 1) {
              metas[i].setAttribute('content', choice === 'dark' ? '#050b0e' : '#f3f7f8');
            }
          }
          var size = localStorage.getItem('ndbrain.textSize');
          if (size) document.documentElement.style.setProperty('--text-scale', size);
        } catch (e) {
          /* system default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
