<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover plus the safe-area padding in the stylesheet keeps the
         header clear of the notch on an iPhone in standalone mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Two values so the browser chrome matches whichever theme is active. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c0f" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <!-- iOS ignores the manifest icons and looks only for this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ndBrain" />

    <title>ndBrain</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
